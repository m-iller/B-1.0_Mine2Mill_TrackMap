# MOMPS local stack — Linux/macOS/WSL. Windows: use WSL2 for bind mounts + line endings.
services:
  postgres:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: momps
      POSTGRES_PASSWORD: momps_dev
      POSTGRES_DB: momps
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U momps -d momps"]
      interval: 5s
      timeout: 5s
      retries: 10

  influxdb:
    image: influxdb:2.7
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: momps
      DOCKER_INFLUXDB_INIT_PASSWORD: momps_dev_influx
      DOCKER_INFLUXDB_INIT_ORG: momps
      DOCKER_INFLUXDB_INIT_BUCKET: telemetry
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: momps-dev-token-replace-in-prod
    ports:
      - "8086:8086"
    volumes:
      - influxdata:/var/lib/influxdb2

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: momps
      RABBITMQ_DEFAULT_PASS: momps_dev
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  influxdata:
